name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip Lambda function
        run: |
          cd python-hello-world
          zip -r python-hello-world.zip lambda_function.py
          mv python-hello-world.zip ../python-hello-world.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Lambda function
        run: |
          aws lambda update-function-code --function-name my-python-lambda-function --zip-file fileb://python-hello-world.zip --region ${{ secrets.AWS_REGION }}